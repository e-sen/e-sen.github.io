name: Deploy

permissions:
  contents: write

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Deploy hexo blog
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'Deploy blog' }}
        run: |
          git config --global url.https://github.com/.insteadOf git@github.com:
          git config --global http.https://github.com/.extraheader "$(git config --local --get http.https://github.com/.extraheader)"
          trap 'git config --global --unset-all http.https://github.com/.extraheader' EXIT
          git config --global user.name e-sen
          git config --global user.email i@iamee.me
          npm run deploy -- --message "$COMMIT_MESSAGE"

