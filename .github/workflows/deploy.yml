name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Deploy hexo blog
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'Deploy blog' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/dsh_blog_deploy
          chmod 600 ~/.ssh/dsh_blog_deploy
          trap 'rm -f ~/.ssh/dsh_blog_deploy' EXIT
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/dsh_blog_deploy -o IdentitiesOnly=yes"
          git config --global user.name e-sen
          git config --global user.email i@iamee.me
          npm run deploy -- --message "$COMMIT_MESSAGE"

